name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — install & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: npm install

      - name: Check for syntax errors
        run: node --check src/index.js src/config.js src/db/database.js src/middleware/auth.js src/routes/auth.js src/routes/library.js src/routes/uploads.js src/services/coverService.js src/services/libraryScanner.js src/services/metadataService.js

  frontend:
    name: Frontend — install & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api

  docker:
    name: Docker Compose — validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          # Inject dummy required values for validation only
          sed -i 's|JWT_SECRET=.*|JWT_SECRET=ci-test-secret-not-real|' .env
          sed -i 's|LIBRARY_PATH=.*|LIBRARY_PATH=/tmp/library|' .env
          sed -i 's|ADMIN_PASSWORD=.*|ADMIN_PASSWORD=ci-test-pass|' .env
          mkdir -p /tmp/library
          docker compose config --quiet
