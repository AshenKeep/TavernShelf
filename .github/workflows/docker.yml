name: Docker

on:
  push:
    branches: [dev]

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./backend/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Every push to dev builds :dev AND :x.y.z AND :latest
          tags: |
            ghcr.io/${{ github.repository_owner }}/tavernshelf:dev
            ghcr.io/${{ github.repository_owner }}/tavernshelf:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/tavernshelf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag for version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only tag if this version tag doesn't already exist
          if ! git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "v$VERSION"; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "Tagged v$VERSION"
          else
            echo "Tag v$VERSION already exists, skipping"
          fi
