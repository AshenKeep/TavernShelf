name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TavernShelf ${{ github.ref_name }}
          body: |
            ## TavernShelf ${{ github.ref_name }}

            ### Quick Start

            1. Copy `docker-compose.yml` from this repo
            2. Create a `.env` file next to it (see `.env.example`)
            3. Run:

            ```bash
            docker compose up -d
            ```

            Open **http://localhost:7624** — sign in with your admin credentials.

            The image is pulled automatically from GHCR. No build step required.

            ---

            See [README.md](./README.md) for full setup instructions, reverse proxy guides, and troubleshooting.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
