name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.0.9
        with:
          name: TavernShelf ${{ github.ref_name }}
          body: |
            ## TavernShelf ${{ github.ref_name }}

            ### Quick Start

            1. Copy `docker-compose.yml` and create a `.env` file next to it
            2. Set your `LIBRARY_PATH`, `JWT_SECRET`, `ADMIN_EMAIL`, `ADMIN_PASSWORD`
            3. Run:

            ```bash
            docker compose up -d
            ```

            Open **http://localhost:7624**

            The image is pulled automatically from GHCR — no build step required.

            ---
            See [README.md](./README.md) for full setup, reverse proxy guides, and troubleshooting.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
