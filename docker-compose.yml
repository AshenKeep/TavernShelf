services:
  tavernshelf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tavernshelf
    ports:
      - "${PORT:-7624}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - run: openssl rand -hex 64}
      - JWT_EXPIRY=${JWT_EXPIRY:-7d}
      - LIBRARY_PATH=/library
      - COVERS_PATH=/app/covers
      - UPLOADS_PATH=/app/uploads
      - DB_PATH=/app/data/tavernshelf.db
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # Set to 1 if running behind a reverse proxy (nginx, Tailscale, Cloudflare, etc.)
      - TRUST_PROXY=${TRUST_PROXY:-0}
    volumes:
      # Your TTRPG library — read-write so approved uploads can be moved here
      - ${LIBRARY_PATH:?LIBRARY_PATH is required - set this to your TTRPG folder}:/library
      - covers_data:/app/covers
      - uploads_data:/app/uploads
      - db_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    labels:
      - "com.tavernshelf.service=app"
      - "com.tavernshelf.version=0.0.2"

volumes:
  covers_data:
    labels:
      com.tavernshelf.volume: "cover thumbnails"
  uploads_data:
    labels:
      com.tavernshelf.volume: "pending upload queue"
  db_data:
    labels:
      com.tavernshelf.volume: "sqlite database"
