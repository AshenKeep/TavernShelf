services:
  nginx:
    image: nginx:alpine
    container_name: tavernshelf-nginx
    ports:
      - "${PORT:-7624}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - covers_data:/app/covers:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tavernshelf
    labels:
      - "com.tavernshelf.service=proxy"
      - "com.tavernshelf.version=0.0.1"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tavernshelf-api
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - run: openssl rand -hex 64}
      - JWT_EXPIRY=${JWT_EXPIRY:-7d}
      - LIBRARY_PATH=/library
      - COVERS_PATH=/app/covers
      - UPLOADS_PATH=/app/uploads
      - DB_PATH=/app/data/tavernshelf.db
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    volumes:
      - ${LIBRARY_PATH:?LIBRARY_PATH is required - set this to your TTRPG folder}:/library:ro
      - covers_data:/app/covers
      - uploads_data:/app/uploads
      - db_data:/app/data
    restart: unless-stopped
    networks:
      - tavernshelf
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    labels:
      - "com.tavernshelf.service=api"
      - "com.tavernshelf.version=0.0.1"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: tavernshelf-frontend
    restart: unless-stopped
    networks:
      - tavernshelf
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - "com.tavernshelf.service=frontend"
      - "com.tavernshelf.version=0.0.1"

volumes:
  covers_data:
    labels:
      com.tavernshelf.volume: "cover thumbnails"
  uploads_data:
    labels:
      com.tavernshelf.volume: "pending upload queue"
  db_data:
    labels:
      com.tavernshelf.volume: "sqlite database"

networks:
  tavernshelf:
    driver: bridge
