services:
  tavernshelf:
    # :latest = stable release
    # :dev    = latest dev build (may be unstable)
    # :x.y.z  = specific version
    image: ghcr.io/ashenkeep/tavernshelf:0.0.3
    container_name: tavernshelf
    ports:
      - "${PORT:-7624}:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - run: openssl rand -hex 64}
      - JWT_EXPIRY=${JWT_EXPIRY:-7d}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - TRUST_PROXY=${TRUST_PROXY:-0}
    volumes:
      - ${LIBRARY_PATH:?LIBRARY_PATH is required}:/library
      - tavernshelf_covers:/app/covers
      - tavernshelf_uploads:/app/uploads
      - tavernshelf_db:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  tavernshelf_covers:
  tavernshelf_uploads:
  tavernshelf_db:
